                            <li class="mb-1"><a target="#2" href="/scoreboard/kumite-2"

                            <li class="mb-1"><a target="#3" href="/scoreboard/kata"

                            <li class="mb-1"><a target="#4" href="/scoreboard/katabendera"

                        <i class='bx bx-x text-2xl'></i>
                    </button>
                    <button
                        class="py-2 px-3 bg-green-600 text-white rounded-lg hover:bg-green-500 flex items-center text-lg ml-2"

            <div id="main-content" class="flex flex-col my-6 pb-6 min-h-[80vh] hidden">
                <div class="flex justify-between mb-4">
                    <div class="flex flex-row flex-1">
                        <input type="text" id="search" placeholder="Cari..."
                            class="text-gray-500 pl-3 bg-white border border-[.1px] border-[#dddddd] p-2 rounded w-1/3 shadow-md focus:outline-none"
                            onkeyup="handlerFilterTable('category')">
                    </div>
                    <button id="creatematch"
                        class="bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-4 rounded shadow mt-[1px] flex items-center mr-3 hidden"
                        title="Buat pertandingan ..." onclick="handlerRenderFormModal()">
                        <i class="bx bx-plus"></i>
                    </button>
                    <div id="category-container"></div>
                    <select id="perPage"
                        class="text-gray-500 bg-white border border-[.1px] border-[#dddddd] p-2 rounded shadow-md focus:outline-none"

                        <option value="15">15</option>
                        <option value="30">30</option>
                        <option value="50">50</option>
                    </select>
                </div>

                                            onclick="handlerSortTable('arena')">
