<!doctype html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta http-equiv="cache-control" content="no-cache" />
  <meta http-equiv="expires" content="0" />
  <meta http-equiv="pragma" content="no-cache" />
  <title>Scoreboard: KUMITE V2</title>
  <link rel="shortcut icon" href="/icons/logo.png" type="image/x-icon" />

  <!-- CSS Reset & Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Local CSS (loaded AFTER tailwind so it can override) -->
  <link rel="stylesheet" href="/files/css/index.css" />
  <link href="/files/css/boxicons.min.css" rel="stylesheet" />
  <link href="/files/css/animate.min.css" rel="stylesheet" />

  <style>
    /* ── Reset & fullscreen base ───────────────────────────── */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      /* no scrollbars */
      background: #000;
      font-family: 'Inter', 'Ubuntu', sans-serif;
    }

    /* ── Outer shell: always fills the physical viewport ──── */
    #viewport-shell {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
    }

    /* ── Inner canvas: rendered at FULL size, then scaled ─── */
    #scale-canvas {
      position: absolute;
      top: 0;
      left: 0;
      /* width/height set by JS to compensate for scale */
      transform-origin: top left;
      /* transform: scale(0.77) set by JS */
    }

    /* confetti overlay stays relative to the outer shell */
    #confetti {
      position: fixed !important;
      z-index: 9999;
    }
  </style>
</head>

<body class="bg-black text-white">

  <!-- Audio -->
  <audio id="short-bell" preload="auto">
    <source src="/sounds/short-bell.mp3" type="audio/mpeg" />
  </audio>
  <audio id="long-bell">
    <source src="/sounds/long-bell.mp3" type="audio/mpeg" />
  </audio>

  <!-- Confetti overlay (outside canvas so it isn't shrunk) -->
  <div id="confetti" class="confetti"></div>

  <!-- Outer viewport shell -->
  <div id="viewport-shell">
    <!-- Inner canvas scaled to 77% -->
    <div id="scale-canvas">
      <main id="content" class="flex flex-col relative" style="width:100%;height:100%;"></main>
    </div>
  </div>

  <!-- Scaling script: runs before scoreboard JS so canvas is ready -->

  <script src="/files/lib/scale-canvas.js"></script>

  <!-- Scoreboard logic -->
  <script src="/files/lib/scoreboard-kumite-2.js"></script>

</body>

</html>
